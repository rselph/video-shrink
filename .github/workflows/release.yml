name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    env:
      ASSET: vshrink-${{ matrix.goos }}-${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o vshrink${{ matrix.ext }} ./cmd/vshrink

      - name: Package
        run: |
          if [ "${{ matrix.goos }}" = windows ]; then
            zip "$ASSET.zip" vshrink.exe
            echo "ARCHIVE=$ASSET.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$ASSET.tar.gz" vshrink
            echo "ARCHIVE=$ASSET.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ARCHIVE" --clobber
